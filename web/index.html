<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eqcorrect ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>eqcorrect 補正結果ビューア</h1>
    <div class="sub" id="subtitle">補正前後の周波数特性 (振幅・位相) を比較します</div>
    <button class="btn" id="btnOpen" type="button">JSON を開く…</button>
    <button class="btn" id="btnTheme" type="button" title="テーマ切替 (自動 → ライト → ダーク)">テーマ: 自動</button>
    <input type="file" id="fileJson" accept=".json,.js,application/json" hidden>
  </header>

  <div id="empty" class="empty" hidden>
    <p><strong>解析データが見つかりません</strong></p>
    <p>ここに <code>result.json</code> をドラッグ＆ドロップするか、「JSON を開く…」で選んでください。<br>
       <code>result.js</code> をこのフォルダに置くと、ダブルクリックで開いても自動で読み込まれます。</p>
  </div>

  <main id="app" hidden>
    <section class="filters" aria-label="表示フィルタ">
      <label>チャンネル <select id="fCh"></select></label>
      <label>周波数範囲
        <select id="fRange">
          <option value="all">全域</option><option value="low">20 Hz – 200 Hz</option>
          <option value="mid">200 Hz – 2 kHz</option><option value="high">2 kHz – 20 kHz</option>
        </select></label>
      <label>位相の表示
        <select id="fPhase"><option value="wrap">±180° に折り返し</option><option value="unwrap">連続 (巻き戻し)</option></select></label>
      <label>スペクトル平滑化
        <select id="fSmooth"><option value="0">なし</option><option value="24">1/24 oct</option><option value="12">1/12 oct</option><option value="6">1/6 oct</option><option value="3">1/3 oct</option></select></label>
    </section>

    <section class="tiles" id="tiles" aria-label="要約"></section>

    <div class="tabs" role="tablist" id="tabs"></div>
    <section class="panel" id="p-resp" role="tabpanel"></section>
    <section class="panel" id="p-spec" role="tabpanel" hidden></section>
    <section class="panel" id="p-filt" role="tabpanel" hidden></section>
    <section class="panel" id="p-wave" role="tabpanel" hidden></section>
    <section class="panel" id="p-info" role="tabpanel" hidden></section>
  </main>
</div>
<script src="result.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
